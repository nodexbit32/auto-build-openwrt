# Description: compile openwrt firmware by GitHub action

name: Compile Official Test
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
env:
  REPO_NAME: Official
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: Official/feeds.conf.default
  CONFIG_FILE: Official/.config
  FILES: Official/files

  # files for patch
  COMP_PATCH: Official/comp_patch
  DIY_P1_SH: Official/diy-part1.sh
  DIY_P2_SH: Official/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Free Up Disk Space
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h

          echo "=== 1. 移除非必要的庞大预装工具链 ==="
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          echo "=== 2. 清理 Docker 缓存与镜像 ==="
          docker system prune -a --volumes -f

          echo "=== 3. 清理 apt 缓存 ==="
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== 4. 清理 Homebrew 与 NPM 缓存 ==="
          brew cleanup --prune=all || true
          rm -rf ~/.cache/Homebrew || true
          npm cache clean --force || true

          echo "=== 清理后磁盘空间 ==="
          df -h
          echo "=============================================================================="


      #=========================================================================================================
      # Checkout and Initialization
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

          sudo timedatectl set-timezone "$TZ"
          sudo chown $USER:$GROUPS $GITHUB_WORKSPACE
      #=========================================================================================================
      - name: Clone source code
        working-directory: ./
        run: |
          df -hT $PWD
          git clone $REPO_URL -b $REPO_BRANCH openwrt

      - name: Load custom feeds
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e $FILES ] && mv $FILES openwrt/files
          [ -e $COMP_PATCH ] && cp -R -v $COMP_PATCH/* openwrt
          [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        id: package
        run: |
          cd openwrt
          
          echo "aaa=$DIST_NAME" >> $GITHUB_OUTPUT
          echo "Pwsh version: ${{ steps.package.outputs.aaa }}"
          echo "Bash version: ${{ steps.package.outputs.aaa }}"

      - name: Print version from file to console
        id: write-content
        shell: bash
        run: |
            echo "Pwsh version: ${{ steps.package.outputs.aaa }}"
            echo "Bash version: ${{ steps.package.outputs.aaa }}"

       name: Upload firmware directory
        uses: actions/upload-artifact@v7
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: ${{ env.REPO_NAME }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          echo "status=success" >> $GITHUB_OUTPUT
          
          # 1. 幕后提取变量（不带 >>，纯内存操作，屏幕不显示）
          TARGET_BOARD=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          TARGET_SUB=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
          DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/')
          
          # 2. 偷偷送进全局环境变量（因为有 >>，屏幕不显示）
          echo "DEVICE_NAME=_${TARGET_BOARD}_${TARGET_SUB}_${DEVICE}" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

          # 3. 【核心救星】纯粹向屏幕开火的 echo（这里绝对能显示！）
          echo "=============================================="
          echo "【人脑AI 强迫症验证面板】"
          echo "提取到的架构: $TARGET_BOARD"
          echo "提取到的位数: $TARGET_SUB"
          echo "提取到的型号: $DEVICE"
          echo "最终完美拼接的名字: _${TARGET_BOARD}_${TARGET_SUB}_${DEVICE}"
          echo "=============================================="
